name: Backend CI

on:
  push:
    tags:
      - 'v*'

# Le déploiement automatique vers le VPS OVH a été retiré le 14 juillet 2026 :
# le serveur tourne désormais sur le homelab (dépôt Homelab,
# services/skinpicker/README.md pour la procédure de déploiement manuel).
# Si un jour on veut re-automatiser : self-hosted runner sur le homelab,
# ou l'action Tailscale pour que le runner GitHub joigne le serveur.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions epinglees par SHA (tags mutables = code arbitraire potentiel).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Aligne sur test.yml : Node 18 est EOL et les `overrides` de securite
          # exigent `20 || >=22`.
          node-version: '22'
      - run: npm ci
      - run: npm test -- --coverage
