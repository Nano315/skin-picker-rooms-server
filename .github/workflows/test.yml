# .github/workflows/test.yml
name: Tests

# Push ecoute uniquement sur main : sinon chaque PR declenche deux runs
# identiques (un pour le push de la branche, un pour la PR).
on:
  push:
    branches: [main]
  pull_request:

# Declenche depuis des forks sur `pull_request` : le job execute `npm ci`
# (scripts d'installation tiers) et les tests du contributeur. Lecture seule.
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      # Actions epinglees par SHA : un tag @v4 est mutable et peut etre
      # repointe vers du code arbitraire.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22 (LTS). Node 18 est en fin de vie, et les `overrides` de
          # securite du package.json (brace-expansion@5, test-exclude@8)
          # declarent `engines.node: 20 || >=22`.
          node-version: '22'
      - run: npm ci

      # Typecheck sur PR : le deploiement lance `npm run build` (tsc), donc une
      # erreur de types ne se revelait qu'au moment de deployer.
      - run: npx tsc --noEmit

      - run: npm test -- --coverage

      # Non bloquant : dependabot n'ouvre plus les majeures automatiquement,
      # c'est donc ici que restent visibles les vulnerabilites qui en exigent une.
      - name: Audit (informatif)
        run: npm audit --audit-level=high || true
