# .github/workflows/test.yml
name: Tests

on: [push, pull_request]

# Declenche depuis des forks sur `pull_request` : le job execute `npm ci`
# (scripts d'installation tiers) et les tests du contributeur. Lecture seule.
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      # Actions epinglees par SHA : un tag @v4 est mutable et peut etre
      # repointe vers du code arbitraire.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 22 (LTS). Node 18 est en fin de vie, et les `overrides` de
          # securite du package.json (brace-expansion@5, test-exclude@8)
          # declarent `engines.node: 20 || >=22`.
          node-version: '22'
      - run: npm ci

      # Typecheck sur PR : le deploiement lance `npm run build` (tsc), donc une
      # erreur de types ne se revelait qu'au moment de deployer.
      - run: npx tsc --noEmit

      - run: npm test -- --coverage
